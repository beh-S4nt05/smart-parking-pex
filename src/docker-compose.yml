services:
  nginx:
    build: ./nginx
    container_name: smartparking-nginx
    restart: always
    ports:
      - "80:80"
    # Sem bind mount de config: a configuração é COPIADA no build (Dockerfile).
    # Editou src/nginx/*.conf? rebuild obrigatório: docker compose up -d --build
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartparking-network

  backend:
    build: ./backend
    container_name: smartparking-backend
    restart: always
    environment:
      # driver +psycopg2 explícito: com SQLAlchemy>=2.1 a URL sem sufixo
      # procura psycopg v3 e o container morria em "unhealthy" (visto na V-02)
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/smartparking
      # "staging" desliga exigência de assinatura HMAC e mantém o resto — ideal
      # para demo/banca por IP na LAN. Produção real: ENVIRONMENT=production +
      # TRUSTED_HOSTS='["seu.dominio"]' e APP_SIGNING_SECRET fortes.
      - ENVIRONMENT=staging
      # ACH-02/M2-02 + ACH-03/M2-01: segredos e URL do QR passam por env do
      # host (padrão mantém a demo local funcionando; produção: exportar ANTES do up).
      - SECRET_KEY=${SECRET_KEY:-mude_efta_chave_secreta_em_producao}
      - APP_SIGNING_SECRET=${APP_SIGNING_SECRET:-smartparking_default_signing_key_change_in_production}
      # QR do simulador: sem isto o código no celular aponta para o localhost DELE.
      # Na demo pela LAN: SIMULADOR_BASE_URL=http://IP_DO_PC:8081 ./scripts/docker.sh up
      - SIMULADOR_BASE_URL=${SIMULADOR_BASE_URL:-http://localhost:8081}
      # Fallback SQLite silencioso desligado: se o Postgres falhar, o container
      # mostra o erro na cara (evita apresentar "dados fantasmas" do .db local)
      - DB_AUTO_SQLITE=false
      # Estado do simulador/QR é memória por processo -> 1 worker (gunicorn_config.py)
      - GUNICORN_WORKERS=1
    ports:
      - "8000:8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim não traz curl/wget; TCP basta para saber que o
      # gunicorn aceitou conexões antes do nginx subir atrás dele
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - smartparking-network

  postgres:
    image: postgres:15-alpine
    container_name: smartparking-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartparking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartparking"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartparking-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartparking-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartparking-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  smartparking-network:
    driver: bridge
