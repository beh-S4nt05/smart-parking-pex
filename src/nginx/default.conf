# Arquivo incluído DENTRO do http{} do nginx.conf (via conf.d/*.conf): é aqui que
# as ZONAS dos limitadores precisam ser declaradas. O conf antigo usava
# zone=req_limit_per_ip / login_limit / conn_limit_per_ip sem nenhuma delas existir
# — `nginx -t` falha com 'unknown "..." zone' e o container entra em crash-loop.
# Teoria completa da diretiva: src/docs/NGINX_EXPLICADO.md.
limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=login_limit:10m   rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

upstream backend_smartparking {
    least_conn;
    # "backend" = nome do serviço no docker-compose (rede smartparking-network)
    server backend:8000 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;

    # Rate limit geral (burst alto: o app faz leituras frequentes do mapa/vagas)
    limit_req zone=req_limit_per_ip burst=50 nodelay;
    limit_conn conn_limit_per_ip 20;

    location / {
        proxy_pass http://backend_smartparking;
        proxy_http_version 1.1;
        # Host real do cliente segue para o backend — TrustedHostMiddleware lê ele
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Login protegido contra força bruta: 5 tentativas/min por IP
    location /auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend_smartparking;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
