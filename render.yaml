# Blueprint para DEMONSTRACAO GRATUITA. Nao e SLA de producao:
# Render Free adormece sem trafego, logo push/expiracoes atrasam.
# Configure todas as variaveis marcadas sync:false pelo painel Render.
services:
  - type: web
    name: smartparking-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: DB_AUTO_SQLITE
        value: "false"
      - key: SEED_DEMO_ON_STARTUP
        value: "false"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_SIGNING_SECRET
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NOTIFICACOES_PUSH_ENABLED
        value: "false"
      - key: NOTIFICATIONS_ENCRYPTION_KEY
        sync: false

  - type: web
    name: smartparking-web
    runtime: static
    buildCommand: cd src/frontend/smart-parking && npm ci --no-audit --no-fund && npx expo export --platform web
    staticPublishPath: src/frontend/smart-parking/dist
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: EXPO_PUBLIC_API_URL_WEB
        sync: false
      # Assinatura legada em clientes publicos NAO e um segredo seguro.
      # JWT/RBAC + autorizacao backend sao a barreira real de acesso.
      - key: EXPO_PUBLIC_APP_SIGNING_SECRET
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
