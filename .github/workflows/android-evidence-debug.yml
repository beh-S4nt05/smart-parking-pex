name: Android Evidence Debug

# Diagnóstico temporário: lê as evidências já produzidas sem recompilar o APK
# nem iniciar outro AVD. Removido junto com a correção definitiva.
on:
  push:
    branches: [arena/b8e63bb8-smart-parking-pex]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperar evidências do run 41745702132
        uses: actions/download-artifact@v4
        with:
          name: android-emulator-evidence
          run-id: 41745702132
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/android-evidence

      - name: Expor tela e erros sem iniciar outro emulador
        run: |
          set -euo pipefail
          printf '== Arquivos ==\n'
          find /tmp/android-evidence -type f -printf '%p (%s bytes)\n' | sort

          printf '\n== API ==\n'
          while IFS= read -r -d '' arquivo; do
            printf '\n--- %s ---\n' "$arquivo"
            tail -n 180 "$arquivo"
          done < <(find /tmp/android-evidence -type f -name 'smartparking-api.log' -print0)

          printf '\n== Maestro ==\n'
          while IFS= read -r -d '' arquivo; do
            printf '\n--- %s ---\n' "$arquivo"
            cat "$arquivo"
          done < <(find /tmp/android-evidence -type f \( -name 'maestro.log' -o -name 'commands.json' -o -name 'manifest.json' \) -print0)

          printf '\n== Tela e ANR ==\n'
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/android-evidence')
          for arquivo in root.rglob('screen-hierarchy/*.json'):
              print(f'--- {arquivo} ---')
              data = json.loads(arquivo.read_text())
              def visitar(node):
                  attrs = node.get('attributes', {})
                  if any(key in attrs for key in ('text', 'content-desc', 'resource-id')):
                      resumo = {key: attrs[key] for key in ('text', 'content-desc', 'resource-id', 'bounds', 'clickable') if key in attrs}
                      print(json.dumps(resumo, ensure_ascii=False))
                  for child in node.get('children', []):
                      visitar(child)
              visitar(data)

          for arquivo in root.rglob('*logcat.txt'):
              print(f'--- {arquivo} ---')
              linhas = arquivo.read_text(errors='replace').splitlines()
              for i, linha in enumerate(linhas):
                  if re.search(r'ANR in|not responding|Reason:|ReactNativeJS|FATAL EXCEPTION|Cleartext|10\.0\.2\.2|Hermes', linha, re.I):
                      inicio = max(0, i - 4)
                      fim = min(len(linhas), i + 18)
                      print('\n'.join(linhas[inicio:fim]))
                      print('---')
          PY

          if command -v tesseract >/dev/null 2>&1; then
            printf '\n== OCR das telas ==\n'
            while IFS= read -r -d '' arquivo; do
              printf '\n--- %s ---\n' "$arquivo"
              tesseract "$arquivo" stdout 2>/dev/null || true
            done < <(find /tmp/android-evidence -type f -name '*.png' -print0)
          fi
