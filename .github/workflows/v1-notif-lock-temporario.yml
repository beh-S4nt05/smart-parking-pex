name: Temporario — resolver lock Expo Notifications V1
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  atualizar-lock-diagnostico:
    if: github.head_ref == 'fix/v1-notificacoes-completas'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/smart-parking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: npm install -g npm@11.17.0
      - name: Preparar delta exato com integridades npm reais
        run: |
          cp package-lock.json /tmp/lock-antigo.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact expo-notifications@58.1.9
          node <<'NODE'
          const fs=require('node:fs');
          const old=JSON.parse(fs.readFileSync('/tmp/lock-antigo.json','utf8'));
          const fresh=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const changed=Object.entries(fresh.packages).filter(([k,v])=>JSON.stringify(old.packages[k])!==JSON.stringify(v));
          const removed=Object.keys(old.packages).filter(k=>!Object.prototype.hasOwnProperty.call(fresh.packages,k));
          console.log('SMARTPARKING_NOTIF_LOCK_DELTA_BEGIN');
          console.log(JSON.stringify({changed,removed,packageJSON:JSON.parse(fs.readFileSync('package.json','utf8'))}));
          console.log('SMARTPARKING_NOTIF_LOCK_DELTA_END');
          NODE
