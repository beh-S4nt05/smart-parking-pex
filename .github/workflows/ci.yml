# M4-01 (SDD/ADR-10): pytest na API + typecheck do front. Os smokes shell
# (smoke_mvp/smoke_acesso) continuam sendo rodados à mão/CI self-hosted com
# Docker — aqui o backend sobe em SQLite puro, sem container.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .   # portao de correcao (src/backend/ruff.toml)
      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check-deps
      - run: npm run check-sdk
      - name: Expo Doctor
        run: |
          set +e
          npm run doctor -- --verbose >/tmp/expo-doctor.log 2>&1
          status=$?
          cat /tmp/expo-doctor.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          message = Path("/tmp/expo-doctor.log").read_text()[-12000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::{message}")
          PY
            exit "$status"
          fi
      - run: npm run typecheck
      - run: npm run check-native
