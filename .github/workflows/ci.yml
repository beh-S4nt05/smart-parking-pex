# M4-01 (SDD/ADR-10): pytest na API + typecheck do front. Os smokes shell
# (smoke_mvp/smoke_acesso) continuam sendo rodados à mão/CI self-hosted com
# Docker — aqui o backend sobe em SQLite puro, sem container.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: npm ci --no-audit --no-fund
        env: { NPM_CONFIG_ENGINE_STRICT: "false" }
      - run: npx tsc --noEmit
