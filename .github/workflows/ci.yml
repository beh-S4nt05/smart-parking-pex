# M4-01 (SDD/ADR-10): pytest na API + typecheck do front. Os smokes shell
# (smoke_mvp/smoke_acesso) continuam sendo rodados à mão/CI self-hosted com
# Docker — aqui o backend sobe em SQLite puro, sem container.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults: { run: { working-directory: src/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .   # portao de correcao (src/backend/ruff.toml)
      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run check-deps
      - run: npm run check-sdk
      - name: Expo Doctor
        run: |
          set +e
          npm run doctor -- --verbose >/tmp/expo-doctor.log 2>&1
          status=$?
          cat /tmp/expo-doctor.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          message = Path("/tmp/expo-doctor.log").read_text()[-12000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::{message}")
          PY
            exit "$status"
          fi
      - run: npm run typecheck
      - run: npm run check-native

  ui:
    name: UI (Chromium, API real)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: pip install -r src/backend/requirements.txt -r src/backend/requirements-dev.txt
        working-directory: .
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Executar jornadas UI
        run: |
          export CI=1 EXPO_OFFLINE=1 EXPO_PUBLIC_API_URL= EXPO_PUBLIC_API_URL_WEB=
          npx expo export --platform web --output-dir dist --clear
          npx playwright test
      - name: Evidências de falha da UI
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-evidencias
          path: |
            src/frontend/smart-parking/test-results/
            src/frontend/smart-parking/playwright-report/
          if-no-files-found: ignore
          retention-days: 5
      - name: Preview das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-ui
          path: src/frontend/smart-parking/test-results/**/preview-*.png
          if-no-files-found: ignore
          retention-days: 5
