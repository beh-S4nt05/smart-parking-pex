# M4-01 (SDD/ADR-10): pytest na API + typecheck do front. Os smokes shell
# (smoke_mvp/smoke_acesso) continuam sendo rodados à mão/CI self-hosted com
# Docker — aqui o backend sobe em SQLite puro, sem container.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults: { run: { working-directory: src/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .   # portao de correcao (src/backend/ruff.toml)
      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript da V1 antes dos avisos do SDK
        run: npm run typecheck
      - run: npm run check-deps
      - run: npm run check-sdk
      - name: Expo Doctor
        run: |
          set +e
          npm run doctor -- --verbose >/tmp/expo-doctor.log 2>&1
          status=$?
          cat /tmp/expo-doctor.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          message = Path("/tmp/expo-doctor.log").read_text()[-12000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::{message}")
          PY
            exit "$status"
          fi
      - run: npm run check-native
      - name: Validar exportacao web SPA para Cloudflare Pages
        run: |
          npm run build:web:piloto
          test -f dist/index.html
          test -f dist/_redirects
          grep -Fxq '/* /index.html 200' dist/_redirects
      # Executa npm audit REAL (sem --force), falha para novas CVEs e mantém
      # somente a exceção GHSA-fc5q-39xc-vjpf sem patch upstream até 18/12/2026.
      # A exceção é temporária, rastreável e expira automaticamente.
      - name: Testar política de auditoria npm
        run: node ../../../scripts/audit_npm_v1.cjs --self-test
      - name: Auditar dependências (gate com exceção temporária)
        run: node ../../../scripts/audit_npm_v1.cjs

  ui:
    name: UI (Chromium, API real)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: pip install -r src/backend/requirements.txt -r src/backend/requirements-dev.txt
        working-directory: .
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Executar jornadas UI
        run: |
          export CI=1 EXPO_OFFLINE=1 EXPO_PUBLIC_API_URL= EXPO_PUBLIC_API_URL_WEB=
          npx expo export --platform web --output-dir dist --clear
          npx playwright test
      - name: Evidências de falha da UI
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-evidencias
          path: |
            src/frontend/smart-parking/test-results/
            src/frontend/smart-parking/playwright-report/
          if-no-files-found: ignore
          retention-days: 5
      - name: Preview das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-ui
          path: src/frontend/smart-parking/test-results/**/preview-*.png
          if-no-files-found: ignore
          retention-days: 5

  nginx-http2:
    name: Nginx HTTP origin e HTTPS HTTP2 (ALPN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe dos scripts de diagnostico e teste
        run: |
          bash -n scripts/diagnosticar_nginx_http2.sh
          bash -n scripts/ci_nginx_http2.sh
          grep -Eq '^[[:space:]]*listen 443 ssl;' src/nginx/https.conf.example
          grep -Eq '^[[:space:]]*http2 on;' src/nginx/https.conf.example
          ! grep -Eq '^[[:space:]]*listen .*http2' src/nginx/https.conf.example
      - name: Nginx -t, proxy HTTP1.1 e negociação TLS/ALPN HTTP2
        run: bash scripts/ci_nginx_http2.sh

  piloto-deploy:
    name: Configuracao segura do piloto (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar scripts de diagnostico e expiracao (sem executar)
        run: |
          bash -n scripts/piloto_preflight.sh
          bash -n scripts/piloto_encerrar.sh
          bash -n scripts/piloto_agendar_encerramento.sh
          test -f src/.env.piloto.example
          grep -q 'Persistent=true' scripts/piloto_agendar_encerramento.sh
          grep -q -- '--https=443 off' scripts/piloto_encerrar.sh
      - name: Validar compose, isolamento de rede e bootstrap
        env:
          PILOT_API_PORT: "18000"
          PILOT_DB_PASSWORD: "0123456789abcdef0123456789abcdef"
          SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          APP_SIGNING_SECRET: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
          NOTIFICATIONS_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          TRUSTED_HOSTS: '["piloto.example.ts.net","localhost","127.0.0.1"]'
          CORS_ORIGINS: '["https://piloto.pages.dev"]'
          SIMULADOR_BASE_URL: "https://piloto.pages.dev"
        run: |
          docker compose -f src/docker-compose.piloto.yml config --format json > /tmp/smartparking-piloto-compose.json
          python3 -m py_compile src/backend/piloto_criar_admin.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("/tmp/smartparking-piloto-compose.json").read_text())
          assert set(cfg["services"]) == {"postgres", "backend"}
          pg = cfg["services"]["postgres"]
          api = cfg["services"]["backend"]
          # Banco nunca exposto em 0.0.0.0/LAN/Tailscale:
          # acesso local opcional 127.0.0.1:15432 para DBeaver.
          pg_ports = pg.get("ports", [])
          assert len(pg_ports) <= 1, "Postgres aceita no maximo a porta local"
          for porta in pg_ports:
              assert porta["host_ip"] == "127.0.0.1", "Postgres exposto fora do loopback"
              assert porta["published"] == "15432"
              assert porta["target"] == 5432
          assert not pg.get("network_mode") == "host"
          assert len(api["ports"]) == 1
          assert api["ports"][0]["host_ip"] == "127.0.0.1"
          assert api["ports"][0]["published"] == "18000"
          assert api["environment"]["ENVIRONMENT"] == "production"
          assert api["environment"]["DB_AUTO_SQLITE"] == "false"
          assert api["environment"]["SEED_DEMO_ON_STARTUP"] == "false"
          print("Piloto: porta privada, banco isolado e bootstrap sintaticamente validos")
          PY
