# M4-01 (SDD/ADR-10): pytest na API + typecheck do front. Os smokes shell
# (smoke_mvp/smoke_acesso) continuam sendo rodados à mão/CI self-hosted com
# Docker — aqui o backend sobe em SQLite puro, sem container.
name: CI

on:
  push:
    branches: [main, "develop/v2"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults: { run: { working-directory: src/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .   # portao de correcao (src/backend/ruff.toml)
      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit --no-fund
      - name: Testar launcher LAN do Expo sem iniciar o Metro
        run: |
          bash -n ../../../scripts/dev-front.sh
          LAN_IP=192.168.50.12 API_PORT=8000 ../../../scripts/dev-front.sh --no-start
          grep -qx 'EXPO_PUBLIC_API_URL_MOBILE=http://192.168.50.12:8000' .env
          LAN_IP=10.1.2.3 API_PORT=8010 ../../../scripts/dev-front.sh --no-start
          grep -qx 'EXPO_PUBLIC_API_URL_MOBILE=http://10.1.2.3:8010' .env
      - run: npm audit --audit-level=moderate
      - run: npm run check-deps
      - run: npm run check-sdk
      - name: Expo Doctor
        run: |
          set +e
          npm run doctor -- --verbose >/tmp/expo-doctor.log 2>&1
          status=$?
          cat /tmp/expo-doctor.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          message = Path("/tmp/expo-doctor.log").read_text()[-12000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::{message}")
          PY
            exit "$status"
          fi
      - run: npm run typecheck
      - run: npm run check-native

  ui:
    name: UI (Chromium, API real)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip", cache-dependency-path: "src/backend/requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0", cache: "npm", cache-dependency-path: "src/frontend/smart-parking/package-lock.json" }
      - run: pip install -r src/backend/requirements.txt -r src/backend/requirements-dev.txt
        working-directory: .
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Executar jornadas UI
        run: |
          export CI=1 EXPO_OFFLINE=1 EXPO_PUBLIC_API_URL= EXPO_PUBLIC_API_URL_WEB=
          npx expo export --platform web --output-dir dist --clear
          npx playwright test
      - name: Evidências de falha da UI
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-evidencias
          path: |
            src/frontend/smart-parking/test-results/
            src/frontend/smart-parking/playwright-report/
          if-no-files-found: ignore
          retention-days: 5
      - name: Preview das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-ui
          path: src/frontend/smart-parking/test-results/**/preview-*.png
          if-no-files-found: ignore
          retention-days: 5

  ota-v2:
    name: EAS Update V2 (após CI verde, se habilitado)
    needs: [backend, frontend, ui]
    # Publicações somente na develop/v2. Nunca liberar a main por acidente.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop/v2'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/smart-parking } }
    steps:
      - uses: actions/checkout@v4
      - name: Verificar pré-requisitos da publicação OTA
        id: config
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_V2_HTTPS: ${{ vars.V2_API_HTTPS_URL }}
        run: |
          if [ -z "$EXPO_TOKEN" ] || [[ "$API_V2_HTTPS" != https://* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "OTA V2 não configurada: adicionar secret EXPO_TOKEN e var V2_API_HTTPS_URL (https://)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const app = JSON.parse(fs.readFileSync('app.json')).expo;
          const id = app.extra?.eas?.projectId;
          const url = app.updates?.url;
          const valid = Boolean(pkg.dependencies?.['expo-updates'] && id && url === `https://u.expo.dev/${id}` && app.runtimeVersion);
          if (!valid) {
            console.error('Faltam expo-updates, projectId/updates.url ou runtimeVersion. Rode eas init e eas update:configure localmente e faça commit.');
            process.exit(1);
          }
          NODE
          then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "OTA V2 ainda não inicializada com EAS; ver docs/EXPO_MOBILE_V2.md." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: src/frontend/smart-parking/package-lock.json
      - name: Instalar dependências travadas
        if: steps.config.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
      - name: Publicar atualização OTA somente no canal v2
        if: steps.config.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL_MOBILE: ${{ vars.V2_API_HTTPS_URL }}
          EXPO_PUBLIC_API_URL: ${{ vars.V2_API_HTTPS_URL }}
          CI: "1"
        run: |
          npm exec --yes --package=eas-cli -- eas update --branch v2 --platform all --non-interactive --message "CI V2 ${GITHUB_SHA}"
          echo "EAS Update V2 publicado a partir de ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
