name: Android Emulator

on:
  # Provisionamento controlado somente nesta branch; removido após a validação.
  push:
    branches: [arena/b8e63bb8-smart-parking-pex]
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL_MOBILE: http://10.0.2.2:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: src/frontend/smart-parking/package-lock.json

      - name: Instalar toolchain do app
        run: |
          npm install --global npm@11.17.0
          npm ci --no-audit --no-fund --prefix src/frontend/smart-parking

      - name: Gerar projeto Android com exceção somente para o host da API
        working-directory: src/frontend/smart-parking
        run: npx expo prebuild --platform android --no-install

      - name: Restaurar componentes nativos do Android SDK
        id: native-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk37-ndk27.1.12297006-cmake3.22.1-v1

      - name: Instalar NDK/CMake exigidos pelo Expo
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Preservar SDK/NDK antes da compilação demorada
        if: steps.native-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk37-ndk27.1.12297006-cmake3.22.1-v1

      - name: Compilar APK release sem manter um AVD ligado
        working-directory: src/frontend/smart-parking/android
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            --no-daemon \
            --stacktrace

      - name: Verificar política de rede do APK
        run: bash scripts/android_native_config_ci.sh

      - name: Publicar APK e configuração nativa para o job do emulador
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          retention-days: 1
          path: |
            src/frontend/smart-parking/android/app/build/outputs/apk/release/app-release.apk
            src/frontend/smart-parking/android/app/src/main/AndroidManifest.xml
            src/frontend/smart-parking/android/app/src/main/res/xml/smartparking_network_security.xml
          if-no-files-found: error

  android-api:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_LOG: /tmp/smartparking-api.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar backend
        run: pip install -r src/backend/requirements.txt

      - name: Subir FastAPI com banco e seed isolados
        run: |
          rm -f /tmp/smartparking-android-emulator.db
          cd src/backend
          DATABASE_URL=sqlite:////tmp/smartparking-android-emulator.db \
            DB_AUTO_SQLITE=false ENVIRONMENT=development DEBUG=true \
            python main.py >"$API_LOG" 2>&1 &
          for tentativa in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat "$API_LOG"
          exit 1

      - name: Instalar Maestro CLI 2.12.1
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-dist"
          curl -fL --retry 3 \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip \
            -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          MAESTRO_BIN="$(find "$RUNNER_TEMP/maestro-dist" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$MAESTRO_BIN"
          echo "$(dirname "$MAESTRO_BIN")" >>"$GITHUB_PATH"
          "$MAESTRO_BIN" --version

      - name: Recuperar o APK compilado no job anterior
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: src/frontend/smart-parking/android/app

      - name: Boot Android 14 (API 34) e validar APK + API + UI
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          # O run 41745702132 registrou 84–91% de pressão de CPU e ANRs do
          # sistema com 2 núcleos; a pressão de memória permaneceu baixa.
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android_emulator_ci.sh

      - name: Publicar logs e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: |
            /tmp/smartparking-api.log
            /tmp/smartparking-*.png
            ${{ runner.temp }}/android-*.txt
            ${{ runner.temp }}/smartparking-window.xml
            ~/.maestro/tests/
          if-no-files-found: ignore
