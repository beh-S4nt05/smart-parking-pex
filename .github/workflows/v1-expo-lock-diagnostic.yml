# Ferramenta temporária para gerar um delta verificável do lockfile no CI.
# Não publica pacotes, não faz push, não usa segredos; remover após o reparo.
name: Diagnostico temporario Expo V1 lockfile
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  diagnosticar:
    if: github.head_ref == 'fix/v1-live-sync-alertas-auditoria'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/smart-parking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: npm install -g npm@11.17.0
      - name: Resolver SDK contra o registry npm sem modificar o remoto
        run: |
          cp package-lock.json /tmp/sp-lock-old.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact \
            expo@58.0.26 expo-router@58.0.32 expo-web-browser@58.1.0
          node <<'NODE'
          const fs=require('fs');
          const old=JSON.parse(fs.readFileSync('/tmp/sp-lock-old.json'));
          const fresh=JSON.parse(fs.readFileSync('package-lock.json'));
          const changed=Object.entries(fresh.packages).filter(([k,v])=>JSON.stringify(old.packages[k])!==JSON.stringify(v));
          const removed=Object.keys(old.packages).filter(k=>!Object.prototype.hasOwnProperty.call(fresh.packages,k));
          console.log('SMARTPARKING_LOCK_DELTA_BEGIN');
          console.log(JSON.stringify({changed, removed, packageJSON:JSON.parse(fs.readFileSync('package.json'))}));
          console.log('SMARTPARKING_LOCK_DELTA_END');
          console.log('Changed:',changed.length,'Removed:',removed.length);
          NODE
      - name: Avaliar correções de segurança sem forçar alterações de SDK
        run: |
          cp package-lock.json /tmp/sp-lock-before-audit.json
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          node <<'NODE'
          const fs=require('fs');
          const old=JSON.parse(fs.readFileSync('/tmp/sp-lock-before-audit.json'));
          const fresh=JSON.parse(fs.readFileSync('package-lock.json'));
          const changed=Object.entries(fresh.packages).filter(([k,v])=>JSON.stringify(old.packages[k])!==JSON.stringify(v));
          const removed=Object.keys(old.packages).filter(k=>!Object.prototype.hasOwnProperty.call(fresh.packages,k));
          console.log('SMARTPARKING_AUDIT_LOCK_BEGIN');
          console.log(JSON.stringify({changed,removed,packageJSON:JSON.parse(fs.readFileSync('package.json'))}));
          console.log('SMARTPARKING_AUDIT_LOCK_END');
          console.log('Changed after audit fix:',changed.length,'Removed:',removed.length);
          NODE
      - name: Diagnóstico de vulnerabilidades
        run: |
          npm audit --json >/tmp/sp-audit.json || true
          node <<'NODE'
          const a=require('/tmp/sp-audit.json');
          console.log('SMARTPARKING_AUDIT_SUMMARY');
          console.log(JSON.stringify({
            metadata:a.metadata?.vulnerabilities,
            vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([k,v])=>({name:k,severity:v.severity,isDirect:v.isDirect,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,range:x.range,title:x.title})})).slice(0,45)
          }));
          NODE
